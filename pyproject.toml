[project]
name = "vnn-survey"
version = "0.1.0"
description = "Literature collection pipeline for a transformer verification survey."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "streamlit>=1.42.0,<2",
    "typer>=0.15.1",
]

[project.scripts]
vnn-survey = "vnn_survey.cli:app"
vnn-survey-app = "vnn_survey.app.launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
